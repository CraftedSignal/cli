# Vendored minimal subset of redcanaryco/atomic-red-team (MIT). Real upstream
# commands; full catalog available via CSCTL_ATOMICS_PATH.
attack_technique: T1547.001
display_name: 'Boot or Logon Autostart Execution: Registry Run Keys / Startup Folder'
atomic_tests:
- name: Reg Key Run
  supported_platforms:
  - windows
  input_arguments:
    key_name:
      description: Name of the Run value
      type: string
      default: AtomicRedTeam
    value:
      description: Command to autorun
      type: string
      default: calc.exe
  executor:
    name: command_prompt
    elevation_required: false
    command: |
      reg add "HKCU\Software\Microsoft\Windows\CurrentVersion\Run" /v #{key_name} /t REG_SZ /d "#{value}" /f
    cleanup_command: |
      reg delete "HKCU\Software\Microsoft\Windows\CurrentVersion\Run" /v #{key_name} /f >nul 2>&1
