name: Build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Get Go version
        id: vars
        run: |
          goVersion=$(grep '^FROM golang' .github/go/Dockerfile | cut -d ':' -f 2 | cut -d '-' -f 1)
          echo "go_version=${goVersion}" >> "$GITHUB_OUTPUT"
          echo "Using Go version ${goVersion}"

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: ${{ steps.vars.outputs.go_version }}
          cache: false

      - name: Download Go modules
        run: go mod download

      # These checks only compile CGO-disabled targets; native runners do not
      # execute them. Reuse one runner and its local build cache for all targets.
      - name: Build all supported targets
        env:
          CGO_ENABLED: 0
        run: |
          set -euo pipefail
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            echo "::group::Build ${target}"
            goos="${target%/*}"
            goarch="${target#*/}"
            output="${RUNNER_TEMP}/csctl-${goos}-${goarch}"
            if [ "$goos" = "windows" ]; then
              output="${output}.exe"
            fi
            GOOS="$goos" GOARCH="$goarch" go build -ldflags="-s -w" -o "$output" ./cmd/csctl
            echo "::endgroup::"
          done
