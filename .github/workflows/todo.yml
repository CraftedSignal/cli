name: TODO to Issue

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  issues: write
  contents: read

jobs:
  todo:
    name: Create Issues from TODOs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - name: TODO to Issue
        uses: alstr/todo-to-issue-action@37bb7b56e58569ef273b60678048030a7f0c261a
        with:
          IDENTIFIERS: '[{"name": "TODO", "labels": ["todo"]}, {"name": "FIXME", "labels": ["bug", "priority"]}, {"name": "HACK", "labels": ["tech-debt"]}, {"name": "OPTIMIZE", "labels": ["performance"]}]'
          CLOSE_ISSUES: true
          AUTO_ASSIGN: true
          ISSUE_TEMPLATE: |
            This issue was automatically created from a code comment.

            **File:** {{ filename }}
            **Line:** {{ line }}
            **Author:** {{ author }}

            ---

            {{ body }}

            ---

            _This issue will be automatically closed when the TODO comment is removed._
